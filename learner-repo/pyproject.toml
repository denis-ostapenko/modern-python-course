[project]
name = "daybook-course"
version = "0.1.0"
description = "Prepared learner workspace for the Modern Python course"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "pyright>=1.1.411,<2",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["checkpoints", "exercises", "capstone", "work"]

[tool.pyright]
extraPaths = ["daybook"]
include = ["main.py", "tests", "tools", "daybook"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
